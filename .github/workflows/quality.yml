name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow CD workflows to reuse these checks as a gate before deploying.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs run repository-controlled scripts (lute/pesde/
# darklua) and never write back to the repo, so read-only is enough. Applies to
# callers too when this workflow is reused via workflow_call.
permissions:
  contents: read

jobs:
  quality:
    name: Format & Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Debug mise
        run: |
          mise ls
          mise which lute || echo "lute not on path"
          mise which stylua || echo "stylua not on path"
          mise which selene || echo "selene not on path"
          mise which pesde || echo "pesde not on path"
          mise which darklua || echo "darklua not on path"
          mise which rojo || echo "rojo not on path"
      
      - name: Install dependencies for scripts (quality checker)
        run: |
          (
            cd scripts
            pesde install --locked
          )
      
      - name: Check formatting & Lint & Build Verification
        run: lute run scripts/src/quality --verbose --build