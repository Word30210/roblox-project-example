name: CD (prod → main place)

# Production never deploys automatically. A maintainer must trigger this run
# manually (Actions tab → this workflow → Run workflow), by default from `main`.
on:
  workflow_dispatch:

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  # Same quality gate as CI, run against the manually-selected ref before deploy.
  quality:
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Build & publish to prod place
    needs: quality
    runs-on: ubuntu-latest
    # Optional: configure required reviewers on a `production` environment in
    # repo settings to add a manual approval gate on top of workflow_dispatch.
    environment: production
    steps:
      - uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install dependencies for scripts (quality checker)
        run: |
          (
            cd scripts
            pesde install --locked
          )

      - name: Build place (sync assets + rojo build)
        env:
          ASPHALT_API_KEY: ${{ secrets.ASPHALT_API_KEY }}
        run: lute run scripts/src/quality --no-stylua --no-selene --no-test --build --sync-assets --verbose

      - name: Publish to prod place
        env:
          RBXCLOUD_API_KEY: ${{ secrets.RBXCLOUD_API_KEY }}
        run: |
          rbxcloud experience publish \
            --filename places/main/main.rbxl \
            --version-type published \
            --place-id ${{ vars.PROD_PLACE_ID }} \
            --universe-id ${{ vars.UNIVERSE_ID }}